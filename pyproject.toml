[project]
name = "zh-tutor-reliability"
version = "0.1.0"
description = "Evidence-reliability experiments for Chinese textbook tutoring"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zh_tutor_reliability"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
